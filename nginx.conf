server {
    listen ${PORT} default_server;
    listen [::]:${PORT} default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Compressão para redes lentas (UBS e áreas remotas)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/manifest+json
        application/xml
        image/svg+xml;

    # ATENÇÃO: no nginx, um `add_header` dentro de um `location` DESCARTA todos os
    # `add_header` herdados do `server`. Por isso os cabeçalhos de segurança ficam
    # em um arquivo próprio, incluído aqui e em cada `location` que define cache.
    include /etc/nginx/snippets/security-headers.conf;

    # Verificação de integridade. Não use /healthz: no domínio run.app esse
    # caminho é interceptado pelo Google e nunca chega ao contêiner.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Arquivos com hash no nome (gerados pelo Vite): cache imutável de 1 ano.
    # Arquivo inexistente responde 404 — nunca o index.html —, para que um chunk
    # antigo pedido depois de um deploy falhe de forma clara e o app recarregue.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Service worker e registro do PWA: sempre revalidar, para atualizar na hora.
    location ~* ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA: qualquer rota desconhecida entrega o index.html, sempre revalidado.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
