# Cabeçalhos de segurança do PresCMed. Incluído pelo nginx.conf no `server` e em
# cada `location` que define `add_header` (ver o aviso de herança lá).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# CSP em modo "somente relatório": até hoje esta política nunca chegou ao
# navegador (era descartada pelo nginx), então ela ainda não foi exercitada com
# login Google / sincronização Firebase em produção. Assim, violações aparecem
# no console sem bloquear nada. Depois de validar esses fluxos, troque o nome do
# cabeçalho para `Content-Security-Policy` para passar a bloquear.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://*.googleapis.com https://*.firebaseio.com; frame-src 'self' https://*.firebaseapp.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
