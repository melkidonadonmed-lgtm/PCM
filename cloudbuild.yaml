# Deploy contínuo do PresCMed no Cloud Run (gatilho: push em main).
# O Dockerfile roda type-check e testes antes do build: se algo falhar, a imagem
# não é gerada e os passos de push/deploy abaixo não executam.

substitutions:
  _REGION: southamerica-east1
  _SERVICE: prescmed
  _REPO: prescmed-repo

steps:
  # 1. Verificação (lint + testes) e build da imagem
  - id: build
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest'
      - '.'

  # 2. Publica a imagem (tag do commit e latest)
  - id: push
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}'

  # 3. Deploy da imagem do commit (rastreável e reversível por revisão)
  - id: deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--labels=commit=$SHORT_SHA'
      - '--quiet'

  # 4. Teste de fumaça: a revisão nova precisa responder e servir o app
  - id: smoke-test
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        URL="$(gcloud run services describe ${_SERVICE} --region=${_REGION} --format='value(status.url)')"
        echo "Verificando $$URL"
        curl --fail --silent --show-error --retry 5 --retry-delay 3 "$$URL/health"
        curl --fail --silent --show-error "$$URL/" | grep -q '<div id="root">'
        curl --fail --silent --show-error --head "$$URL/" | grep -qi '^x-content-type-options: nosniff'
        echo "Revisão publicada e respondendo."

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest'

timeout: 1200s

options:
  logging: CLOUD_LOGGING_ONLY
